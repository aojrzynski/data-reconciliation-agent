entity: orders
source_key: order_id
target_key: order_id
field_mappings:
  - source: customer_id
    target: customer_id
    comparator: string
  - source: order_date
    target: order_date
    comparator: date
  - source: status
    target: order_status
    comparator: string
    normalize:
      trim: true
      case_sensitive: false
  - source: amount
    target: total_amount
    comparator: number
    tolerance: 0.01
  - source: currency
    target: currency_code
    comparator: string
  - source: last_updated
    target: updated_at
    comparator: datetime
